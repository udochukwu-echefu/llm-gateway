services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: local-only-example
      POSTGRES_DB: gateway
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks: [default, loadtest]
  redis:
    image: redis:7.4.5
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks: [default, loadtest]
  gateway-observability:
    profiles: [observability]
    build: .
    env_file: .env
    environment:
      GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:local-only-example@postgres:5432/gateway
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_METRICS__HOST: 0.0.0.0
      GATEWAY_METRICS__PORT: 9464
      GATEWAY_METRICS__ENABLED: "true"
      GATEWAY_TRACING__OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      GATEWAY_LOG_FORMAT: json
      GATEWAY_READONLY_DB_PASSWORD: ${GATEWAY_READONLY_DB_PASSWORD:-}
      GATEWAY_ADMIN_API__ENABLED: ${GATEWAY_ADMIN_API__ENABLED:-false}
      GATEWAY_ADMIN_API__HOST: 0.0.0.0
    command: [sh, -c, "alembic upgrade head && exec uvicorn llm_gateway.main:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log"]
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  prometheus:
    profiles: [observability, loadtest]
    image: prom/prometheus:v3.2.1
    volumes:
      - ${PROMETHEUS_CONFIG_DIR:-./observability/prometheus}:/etc/prometheus:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks: [default, loadtest]
  grafana:
    profiles: [observability]
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GATEWAY_READONLY_DB_PASSWORD: ${GATEWAY_READONLY_DB_PASSWORD:-}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.67.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

  fake-provider:
    profiles: [loadtest]
    build: .
    image: llm-gateway:loadtest
    environment:
      PYTHONPATH: /bench
      FAKE_LATENCY_MS: ${FAKE_LATENCY_MS:-200}
      FAKE_CHUNK_COUNT: ${FAKE_CHUNK_COUNT:-20}
      FAKE_CHUNK_INTERVAL_MS: ${FAKE_CHUNK_INTERVAL_MS:-50}
    volumes:
      - ./loadtest/fake_provider:/bench/loadtest/fake_provider:ro
    command: [uvicorn, loadtest.fake_provider.app:create_app, --factory, --host, 0.0.0.0, --port, "8000", --no-access-log, --log-level, warning]
    ports: ["127.0.0.1:18000:8000"]
    networks: [loadtest]

  gateway-loadtest-1: &loadtest-gateway
    profiles: [loadtest]
    build: .
    image: llm-gateway:loadtest
    env_file:
      - path: ./loadtest/.state/runtime.env
        required: false
    environment:
      GATEWAY_PROVIDERS__GROQ__API_KEY: fake-provider-only
      GATEWAY_PROVIDERS__GROQ__BASE_URL: http://fake-provider:8000/v1
      GATEWAY_PROVIDERS__OPENAI__API_KEY: fake-provider-only
      GATEWAY_PROVIDERS__OPENAI__BASE_URL: http://fake-provider:8000/v1
      GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:local-only-example@postgres:5432/gateway_loadtest
      GATEWAY_REDIS_URL: redis://redis:6379/14
      GATEWAY_METRICS__HOST: 0.0.0.0
      GATEWAY_METRICS__ENABLED: "true"
      GATEWAY_ADMIN_API__ENABLED: "false"
      GATEWAY_LIMITS__FAIL_MODE: closed
      GATEWAY_LOG_LEVEL: WARNING
    ports: ["127.0.0.1:18001:8000"]
    networks: [loadtest]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  gateway-loadtest-2:
    <<: *loadtest-gateway
    ports: ["127.0.0.1:18002:8000"]

  loadtest-nginx:
    profiles: [loadtest]
    image: nginx:1.28.0-alpine
    volumes: ["./loadtest/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports:
      - "127.0.0.1:18080:8000"
      - "127.0.0.1:18001:8001"
      - "127.0.0.1:18002:8002"
      - "127.0.0.1:18000:8003"
    networks: [default, loadtest]
    depends_on: [gateway-loadtest-1, gateway-loadtest-2]

  k6:
    profiles: [loadtest]
    image: grafana/k6:1.3.0
    user: "${LOADTEST_UID:-1000}:${LOADTEST_GID:-1000}"
    volumes:
      - ./loadtest/k6:/scripts:ro
      - ./loadtest/.state:/credentials:ro
      - ./loadtest/results:/results
    networks: [loadtest]

networks:
  loadtest:
    internal: true
