name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ci-only-example
          POSTGRES_DB: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 2s --health-timeout 2s --health-retries 15
      redis:
        image: redis:7.4.5
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      CI: "true"
      GATEWAY_TEST_DATABASE_URL: postgresql+asyncpg://gateway:ci-only-example@127.0.0.1:5432/gateway
      GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:ci-only-example@127.0.0.1:5432/gateway
      GATEWAY_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      GATEWAY_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: admin-console/.nvmrc
          cache: npm
          cache-dependency-path: admin-console/package-lock.json
      - name: Install console runtime dependencies
        working-directory: admin-console
        run: npm ci --omit=dev --no-audit --no-fund
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest -q
      - name: Validate alert rules
        run: docker run --rm --entrypoint promtool -v "$PWD/observability/prometheus:/etc/prometheus:ro" prom/prometheus:v3.2.1 check rules /etc/prometheus/alerts.yml
      - name: Database tests
        run: uv run pytest -q -m db
      - name: Redis tests
        run: uv run pytest -q -m redis

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t llm-gateway:ci .
      - name: Smoke test
        run: |
          # Dummy cache key: standard base64 encoding of 32 zero bytes, only for CI.
          docker run -d --name gateway -p 8000:8000 \
            -e GATEWAY_PROVIDERS__GROQ__API_KEY=ci-placeholder \
            -e GATEWAY_API_KEY_PEPPER=ci-only-fake-pepper-at-least-32-bytes \
            -e GATEWAY_CACHE_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e GATEWAY_DATABASE_URL=postgresql+asyncpg://fake:fake@127.0.0.1:1/fake \
            -e GATEWAY_REDIS_URL=redis://127.0.0.1:1/0 \
            llm-gateway:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          docker logs gateway
          exit 1
      - name: Remove smoke container
        if: always()
        run: docker rm -f gateway || true

  loadtest-smoke:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Install locked tools
        run: uv sync --locked
      - name: Start Postgres and Redis
        run: docker compose --env-file /dev/null up -d
      - name: Fake-provider load smoke (30 seconds)
        run: uv run python -m loadtest.smoke
      - name: Preserve metadata-only results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-smoke
          path: loadtest/results/
          retention-days: 7


  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ci-only-example
          POSTGRES_DB: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 2s --health-timeout 2s --health-retries 15
      redis:
        image: redis:7.4.5
        ports: ["6379:6379"]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ADMIN_API_URL: http://127.0.0.1:18091
      ADMIN_CONSOLE_ORIGIN: http://localhost:3100
      ADMIN_CONSOLE_SESSION_SECRET: obviously-fake-ci-session-secret-at-least-32-bytes
      CONSOLE_TEST_DATABASE_URL: postgresql+asyncpg://gateway:ci-only-example@127.0.0.1:5432/gateway
    defaults:
      run:
        working-directory: admin-console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: admin-console/.nvmrc
          cache: npm
          cache-dependency-path: admin-console/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install locked gateway tools
        working-directory: .
        run: uv sync --locked
      - name: Install pinned console dependencies
        run: npm ci --no-audit --no-fund
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Real-stack end-to-end and response no-leak scan
        run: npm run test:e2e

  demo-appliance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: admin-console/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned console dependencies
        working-directory: admin-console
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: admin-console
        run: npx playwright install --with-deps chromium
      - name: Build the revision-labelled appliance
        run: docker compose -f deploy/demo/compose.yaml --profile demo-test build --build-arg DEMO_SOURCE_REVISION="$(git rev-parse HEAD)" appliance
      - name: Run demo appliance end-to-end tests
        working-directory: admin-console
        run: CONSOLE_TEST_PORT=3300 npm run test:e2e:demo
      - name: Upload demo Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: demo-appliance-playwright-report
          path: admin-console/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down demo appliance test profile
        if: always()
        run: docker compose -f deploy/demo/compose.yaml --profile demo-test down --volumes --remove-orphans
