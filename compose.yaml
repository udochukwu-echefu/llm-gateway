services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: local-only-example
      POSTGRES_DB: gateway
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      timeout: 2s
      retries: 15
  redis:
    image: redis:7.4.5
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
