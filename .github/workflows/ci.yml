name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t llm-gateway:ci .
      - name: Smoke test
        run: |
          docker run -d --name gateway -p 8000:8000 -e GATEWAY_PROVIDERS__GROQ__API_KEY=ci-placeholder llm-gateway:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          docker logs gateway
          exit 1
