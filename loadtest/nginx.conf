events { worker_connections 4096; }
http {
    access_log off;
    upstream replicas {
        server gateway-loadtest-1:8000;
        server gateway-loadtest-2:8000;
        keepalive 128;
    }
    server {
        listen 8000;
        location / {
            proxy_pass http://replicas;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
    }
    # Host diagnostics cross the internal network here; k6 singles bypass nginx.
    server {
        listen 8001;
        location / { proxy_pass http://gateway-loadtest-1:8000; proxy_buffering off; }
    }
    server {
        listen 8002;
        location / { proxy_pass http://gateway-loadtest-2:8000; proxy_buffering off; }
    }
    server {
        listen 8003;
        location / { proxy_pass http://fake-provider:8000; proxy_buffering off; }
    }
}
